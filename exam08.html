<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head> <!-- style sheet는 기본적으로 head에 작성됨 -->
<style>
    * {color: blue;} /*전체 선택자*/
    p {background-color: yellow;} /*태그 선택자*/
    .c1 {border: 1px solid red;} /*클래스 선택자*/
    #n1 {background-color: aqua;} /*아이디 선택자*/
</style>
<body>
    <h1 style="color:red;">CSS 스타일</h1> <!--인라인으로 지정한 부분은 red로 남았음 (우선순위)-->
    <h2 class="c1">스타일 사용</h2>
    <p>CSS는 디자인과 정보의 분리를 위해 사용</p> <!-- 블록 형태이므로 가로줄이 꽉차게 이루어져있음, back ground 시 끝까지 칠해짐-->
    <p class="c1">CSS는 디자인과 정보의 분리를 위해 사용</p>
    <ul>
        <li id="n1">HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <ol>
        <li id="n1">HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
</body>
</html>
