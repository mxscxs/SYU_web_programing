<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head> <!-- style sheet는 기본적으로 head에 작성됨 -->
<style>
    /*링크 가상 클래스*/
    a:link {color: black; text-decoration: none;} 
    a:visited {color: black;}
    a:hover {color: cyan;}
    a:active {background-color: darkgray;} /*꾹 누르고 있으면 색 확인 가능*/
</style>
<style>
    /* * {color: blue;} /*전체 선택자*/ */
    p {background-color: yellow;} /*태그 선택자*/
    .c1 {border: 1px solid red;} /*클래스 선택자 -> 여러개!! (아이디는 무조건 하나, 클래스는 여러개)*/
    #n1 {background-color: aqua;} /*아이디 선택자 -> 동일 아이디를 통해 여러개 선택 시 모두 적용은 가능함, 하지만 이렇게 사용X (js에 영향을 줌) 아이디는 오직 하나의 element만 선택할 때 사용*/
    ul li {color: brown;} /*하위 선택자 (띄어쓰기)*/
    ol>li {color: chartreuse;} /*자식 선택자 (부등호 >)*/
</style>
<body>
    <h1 style="color:red;">CSS 스타일</h1> <!--인라인으로 지정한 부분은 red로 남았음 (우선순위)-->
    <h2 class="c1">스타일 사용</h2>
    <p>CSS는 디자인과 정보의 분리를 위해 사용</p> <!-- 블록 형태이므로 가로줄이 꽉차게 이루어져있음, back ground 시 끝까지 칠해짐-->
    <p class="c1">CSS는 디자인과 정보의 분리를 위해 사용</p>
    <ul>
        <li id="n1">HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <a herf="https://www.syu.ac.kr/">삼육대학교</a>
</body>
</html>
