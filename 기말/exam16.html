<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<script>
    let number = prompt('점수를 입력하세요'); //변수 생성
    if (number >= 90) {
        alert('A');
    }
    else if (number >= 80) {
        alert('B');
    }
    else if (number >= 70) {
        alert('C')
    }
    else if (number >= 60) {
        alert('D')
    }
    else {
        alert('F')
    }
</script>
