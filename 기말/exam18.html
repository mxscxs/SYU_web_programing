<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    //반복문: 실행할 문장/명령을 하나의 문장으로 패턴화 시켜야 함 (변수 이용)
    let num = 1;
    while(num <= 10) { 
        //조건이 항상 참이면 안 되기 때문에 조건식에 대한 결과가 참 -> 거짓이 되도록 조건식 세우기
        //변수를 이용하고 있고 매 실행마다 이 변수의 깂이 변화하므로 변수를 통한 조건식 세우기
        documentw.write(num + '<br>');
        num++; //변수값을 계속해서 바꿔주여야 함
    }
    for(num = 1; num <= 10; num++) {
        document.write(num + '<br>');
    }
    //while과 for는 이름만 다른 것 -> 완전히 똑같음 (서로 변환이 가능함, 구문의 구조만 다름)
    /*반복 횟수가 픽스(고정)되어 있음 -> for
    반복 획수가 고정되어있지 않음, 특수한 상황에 종료되어야 함 -> while
    위와 같은 경우에 각각의 반복문이 많이 사용됨 */
</script>
<body>
    <h1>JS 반복문 연습</h1>
</body>
</html>
