<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let sum = 0;
    let i = 0;

    while( i <= 100) {
        sum = sum + i;
        i++;
    }
    document.write(sum + '<br>');
</script>
<body>
    <h1>JS반복문 연습2</h1>
</body>
</html>
