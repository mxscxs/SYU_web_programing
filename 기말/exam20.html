<script>
    let sum = 0;
    let i = 0;

    /* while( i <= 100) {

            }

    for(i = 0; i <= 100; i++) {
        if(i % 2 != 0) continue;
        sum = sum + i;
    } 
    document.write(sum + '<br>');
</script>
