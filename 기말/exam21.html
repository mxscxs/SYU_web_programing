<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .c1 { color: brown; }
</style>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<script>
    $(document).ready(function() {
        $('button').click(function(){
            $('h1').css('color', 'red');
            $('p').css('backgroundColor', 'yellow'); //background-color로 써도 됨 (css property 형태로 작성해도 괜찮음)
            $('img').attr('src', 'https://placehold.co/300x300');
            $('#t1').text('<a href="https://www.syu.ac.kr">text()</a>'); //text 함수 사용
            $('#t2').html('<a href="https://www.syu.ac.kr">html()</a>') //html 함수 사용
            $('#t1').toggleClass('c1'); //클래스 c1이 있으면 remove되고 없으면 add됨 -> 기존 색, brown, 기존 색 반복됨 (버튼이 눌림에 따라)
        });
    });
</script>

<body>
    <h1>jQuery 예제</h1>
    <p>삼육대학교</p>
    <p id="t1">인공지능융합학부</p>
    <p id="t2">웹프로그래밍</p>
    <img><br>
    <img src="https://placehold.co/100x100"><br>
    <button>클릭하세요.</button>
</body>
</html>
